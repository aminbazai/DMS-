<style>
  :root { --navy:#060b18; --navy-light:#0a1022; --navy-lighter:#0e162e; --navy-border:#1a2540; --accent:#38bdf8; --accent-light:#7dd3fc; --indigo:#6366f1; --purple:#a855f7; }
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { background:var(--navy); color:#e2e8f0; font-family:'Noto Sans',sans-serif; height:100%; overflow:hidden; }
  body { display:flex; flex-direction:column; }

  .bg-orbs { position:fixed; inset:0; pointer-events:none; z-index:0; overflow:hidden; }
  .orb { position:absolute; border-radius:50%; filter:blur(70px); opacity:.3; animation:drift 20s ease-in-out infinite; }
  .orb1 { width:500px;height:500px; background:radial-gradient(circle,rgba(56,189,248,.5),transparent 70%); top:-120px; right:-120px; }
  .orb2 { width:420px;height:420px; background:radial-gradient(circle,rgba(99,102,241,.45),transparent 70%); bottom:-100px; left:-100px; animation-delay:-7s; }
  .orb3 { width:300px;height:300px; background:radial-gradient(circle,rgba(168,85,247,.4),transparent 70%); top:40%; left:40%; animation-delay:-14s; }
  @keyframes drift { 0%,100%{transform:translate(0,0)} 50%{transform:translate(30px,-40px)} }

  .app { position:relative; z-index:1; display:flex; height:100vh; }
  .sidebar { width:250px; background:rgba(10,16,34,.85); backdrop-filter:blur(24px); border-right:1px solid rgba(56,189,248,.06); display:flex; flex-direction:column; overflow:hidden; transition:width .3s; }
  .sidebar.collapsed { width:0; }
  .sb-header { padding:16px; border-bottom:1px solid rgba(255,255,255,.03); display:flex; align-items:center; gap:10px; }
  .sb-logo { width:34px;height:34px; border-radius:9px; background:linear-gradient(135deg,rgba(56,189,248,.2),rgba(99,102,241,.2)); border:1px solid rgba(255,255,255,.06); display:flex; align-items:center; justify-content:center; }
  .sb-title { font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:700; color:#fff; }
  .sb-sub { font-size:9px; color:#64748b; text-transform:uppercase; letter-spacing:1.5px; }
  .sb-nav { flex:1; overflow-y:auto; padding:8px; }
  .sb-group { margin-bottom:4px; }
  .sb-group-btn { width:100%; display:flex; align-items:center; justify-content:space-between; padding:8px 10px; font-size:10px; font-weight:600; color:#64748b; text-transform:uppercase; letter-spacing:1.5px; background:transparent; border:none; cursor:pointer; border-radius:6px; }
  .sb-group-btn:hover { color:#94a3b8; }
  .sb-group-btn .chev { transition:transform .2s; }
  .sb-group-btn.open .chev { transform:rotate(90deg); color:var(--accent); }
  .sb-items { display:none; flex-direction:column; gap:1px; padding-left:4px; }
  .sb-items.open { display:flex; }
  .sb-item { display:flex; align-items:center; gap:8px; padding:7px 10px; border-radius:7px; font-size:13px; color:#94a3b8; cursor:pointer; border:none; background:transparent; text-align:left; width:100%; transition:all .2s; }
  .sb-item:hover { color:#e2e8f0; background:rgba(255,255,255,.03); }
  .sb-item.active { background:linear-gradient(135deg,rgba(56,189,248,.12),rgba(99,102,241,.08)); color:var(--accent); border-left:2px solid var(--accent); }
  .sb-item .ic { width:16px; text-align:center; }
  .sb-footer { padding:10px 12px; border-top:1px solid rgba(255,255,255,.03); font-size:9px; color:#475569; }

  .main { flex:1; display:flex; flex-direction:column; overflow:hidden; }
  .topbar { display:flex; align-items:center; justify-content:space-between; padding:12px 20px; background:rgba(10,16,34,.75); backdrop-filter:blur(20px); border-bottom:1px solid rgba(56,189,248,.06); }
  .topbar-left { display:flex; align-items:center; gap:12px; }
  .menu-btn { background:transparent; border:none; color:#94a3b8; cursor:pointer; padding:6px; border-radius:6px; }
  .menu-btn:hover { background:rgba(255,255,255,.05); color:#fff; }
  .page-title { font-family:'Rajdhani',sans-serif; font-size:18px; font-weight:600; color:#fff; }
  .topbar-right { display:flex; align-items:center; gap:12px; }
  .status-pill { display:flex; align-items:center; gap:6px; padding:6px 12px; border-radius:8px; background:rgba(255,255,255,.02); border:1px solid rgba(255,255,255,.04); font-size:11px; color:#64748b; }
  .status-dot { width:7px;height:7px;border-radius:50%;background:#34d399;box-shadow:0 0 8px #34d399; animation:pulse 2s infinite; }

  .user-chip { display:flex; align-items:center; gap:8px; padding:6px 10px; border-radius:8px; background:rgba(255,255,255,.03); }
  .user-avatar { width:26px;height:26px; border-radius:7px; background:linear-gradient(135deg,var(--accent),var(--indigo)); display:flex; align-items:center; justify-content:center; font-size:12px; font-weight:700; color:#fff; }
  .user-name { font-size:12px; color:#e2e8f0; }
  .content { flex:1; overflow-y:auto; padding:20px; }
  .page-enter { animation: page-enter .4s ease-out; }
  @keyframes page-enter { 0%{opacity:0;transform:translateY(12px)} 100%{opacity:1;transform:translateY(0)} }
  .mouse-orb { position:fixed; width:600px; height:600px; border-radius:50%; pointer-events:none; z-index:0; background:radial-gradient(circle,rgba(56,189,248,.06) 0%,transparent 70%); transform:translate(-50%,-50%); transition:left .8s ease-out,top .8s ease-out; }

  /* common */
  .card { background:rgba(10,16,34,.6); border:1px solid rgba(26,37,64,.6); border-radius:12px; padding:18px; backdrop-filter:blur(12px); margin-bottom:16px; }
  .card:hover { border-color:rgba(56,189,248,.12); }
  .section-title { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; color:#fff; margin-bottom:14px; display:flex; align-items:center; gap:8px; }
  .grid { display:grid; gap:14px; }
  .grid-2 { grid-template-columns:repeat(2,1fr); }
  .grid-3 { grid-template-columns:repeat(3,1fr); }
  .grid-4 { grid-template-columns:repeat(4,1fr); }
  .grid-6 { grid-template-columns:repeat(6,1fr); }
  @media (max-width:1100px){ .grid-6{grid-template-columns:repeat(3,1fr)} .grid-4{grid-template-columns:repeat(2,1fr)} }
  @media (max-width:800px){ .grid-3,.grid-2{grid-template-columns:1fr} .grid-6{grid-template-columns:repeat(2,1fr)} }

  .kpi { background:rgba(10,16,34,.5); border:1px solid rgba(255,255,255,.04); border-radius:12px; padding:14px; position:relative; overflow:hidden; transition:all .3s; }
  .kpi:hover { transform:translateY(-3px); box-shadow:0 12px 30px rgba(0,0,0,.3); }
  .kpi .label { font-size:10px; color:#64748b; text-transform:uppercase; letter-spacing:1px; }
  .kpi .val { font-family:'Rajdhani',sans-serif; font-size:22px; font-weight:700; color:#fff; margin-top:4px; }
  .kpi .sub { font-size:10px; color:#475569; margin-top:2px; }
  .kpi .bar { position:absolute; bottom:0; left:0; height:2px; width:55%; }

  .btn { display:inline-flex; align-items:center; gap:6px; padding:8px 14px; border-radius:8px; font-family:'Rajdhani',sans-serif; font-weight:600; font-size:13px; letter-spacing:.4px; cursor:pointer; border:1px solid transparent; transition:all .2s; }
  .btn-primary { background:linear-gradient(135deg,rgba(56,189,248,.2),rgba(99,102,241,.2)); color:#7dd3fc; border:1px solid rgba(56,189,248,.15); }
  .btn-primary:hover { background:linear-gradient(135deg,rgba(56,189,248,.3),rgba(99,102,241,.3)); }
  .btn-secondary { background:rgba(26,37,64,.5); color:#94a3b8; border:1px solid rgba(26,37,64,.5); }
  .btn-secondary:hover { background:rgba(26,37,64,.8); color:#e2e8f0; }
  .btn-danger { background:rgba(239,68,68,.15); color:#fca5a5; border:1px solid rgba(239,68,68,.2); }
  .btn-sm { padding:5px 10px; font-size:12px; }
  .btn-grad { background:linear-gradient(135deg,#38bdf8,#818cf8); color:#fff; border:none; box-shadow:0 6px 20px rgba(56,189,248,.3); }
  .btn-grad:hover { transform:translateY(-1px); }

  input,select,textarea { background:rgba(14,22,46,.8); border:1px solid rgba(26,37,64,.8); color:#e2e8f0; border-radius:7px; padding:8px 11px; outline:none; font-family:'Noto Sans',sans-serif; font-size:13px; width:100%; }
  input:focus,select:focus,textarea:focus { border-color:rgba(56,189,248,.4); box-shadow:0 0 0 1px rgba(56,189,248,.15); }
  label { font-size:11px; color:#94a3b8; margin-bottom:4px; display:block; font-weight:500; }
  .form-row { display:grid; grid-template-columns:repeat(2,1fr); gap:10px; margin-bottom:10px; }
  .form-row-3 { grid-template-columns:repeat(3,1fr); }
  .form-group { margin-bottom:10px; }

  .table-wrap { overflow-x:auto; border-radius:8px; border:1px solid rgba(26,37,64,.5); }
  table { width:100%; border-collapse:collapse; font-size:13px; }
  th { background:rgba(14,22,46,.6); color:var(--accent); font-family:'Rajdhani',sans-serif; font-size:12px; font-weight:600; text-transform:uppercase; letter-spacing:.5px; padding:10px 12px; text-align:left; white-space:nowrap; }
  td { padding:9px 12px; border-bottom:1px solid rgba(26,37,64,.4); color:#cbd5e1; }
  tr:hover td { background:rgba(14,22,46,.4); }
  tr:nth-child(even) td { background:rgba(6,11,24,.3); }
  tr:nth-child(even):hover td { background:rgba(14,22,46,.4); }

  .badge { display:inline-block; padding:3px 8px; border-radius:6px; font-size:11px; font-weight:600; }
  .badge-green { background:rgba(16,185,129,.15); color:#6ee7b7; }
  .badge-red { background:rgba(239,68,68,.15); color:#fca5a5; }
  .badge-blue { background:rgba(56,189,248,.15); color:#7dd3fc; }
  .badge-amber { background:rgba(245,158,11,.15); color:#fcd34d; }

  .modal-overlay { position:fixed; inset:0; background:rgba(0,0,0,.6); backdrop-filter:blur(4px); z-index:100; display:none; align-items:center; justify-content:center; }
  .modal-overlay.show { display:flex; }
  .modal { background:rgba(10,16,34,.95); border:1px solid rgba(26,37,64,.7); border-radius:14px; padding:22px; width:90%; max-width:560px; max-height:85vh; overflow-y:auto; box-shadow:0 30px 80px rgba(0,0,0,.6); }
  .modal h3 { font-family:'Rajdhani',sans-serif; font-size:20px; font-weight:700; color:#fff; margin-bottom:14px; }
  .modal-actions { display:flex; gap:10px; justify-content:flex-end; margin-top:14px; }

  .toast { position:fixed; bottom:20px; right:20px; background:rgba(10,16,34,.95); border:1px solid rgba(56,189,248,.3); color:#e2e8f0; padding:12px 18px; border-radius:10px; font-size:13px; z-index:200; transform:translateY(100px); opacity:0; transition:all .3s; box-shadow:0 10px 40px rgba(0,0,0,.4); }
  .toast.show { transform:translateY(0); opacity:1; }

  .empty { text-align:center; padding:40px 20px; color:#475569; font-size:13px; }
  .empty .ic { font-size:36px; margin-bottom:8px; opacity:.5; }

  .tabs { display:flex; gap:6px; margin-bottom:14px; border-bottom:1px solid rgba(26,37,64,.5); padding-bottom:8px; }
  .tab { padding:6px 14px; border-radius:7px; font-size:12px; font-weight:600; color:#94a3b8; cursor:pointer; background:transparent; border:none; font-family:'Rajdhani',sans-serif; letter-spacing:.4px; }
  .tab.active { background:rgba(56,189,248,.12); color:var(--accent); }

  .chart-bars { display:flex; align-items:flex-end; gap:8px; height:140px; padding:0 4px; }
  .chart-bar { flex:1; background:linear-gradient(180deg,var(--accent),rgba(56,189,248,.2)); border-radius:4px 4px 0 0; position:relative; min-height:4px; transition:height .6s; }
  .chart-bar .lbl { position:absolute; bottom:-18px; left:0; right:0; text-align:center; font-size:9px; color:#64748b; }
  .chart-bar .val { position:absolute; top:-16px; left:0; right:0; text-align:center; font-size:9px; color:#94a3b8; }

  .calc-grid { display:grid; grid-template-columns:repeat(4,1fr); gap:6px; max-width:320px; }
  .calc-btn { padding:14px; border-radius:8px; background:rgba(26,37,64,.6); border:1px solid rgba(26,37,64,.6); color:#e2e8f0; font-size:16px; font-family:'Rajdhani',sans-serif; font-weight:600; cursor:pointer; transition:all .15s; }
  .calc-btn:hover { background:rgba(56,189,248,.15); border-color:rgba(56,189,248,.3); }
  .calc-btn.op { background:rgba(56,189,248,.12); color:var(--accent); }
  .calc-display { background:rgba(6,11,24,.6); border:1px solid rgba(26,37,64,.6); border-radius:8px; padding:14px; font-size:24px; font-family:'Rajdhani',sans-serif; text-align:right; color:#fff; margin-bottom:8px; min-height:50px; word-break:break-all; }

  .theme-switcher { display:flex; flex-wrap:wrap; gap:6px; }
  .theme-dot { width:26px;height:26px; border-radius:7px; cursor:pointer; border:2px solid transparent; transition:all .2s; }
  .theme-dot:hover { transform:scale(1.1); }
  .theme-dot.active { border-color:#fff; }

  .report-box { background:rgba(10,16,34,.5); border:1px solid rgba(26,37,64,.5); border-radius:10px; padding:16px; }
  .report-row { display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(26,37,64,.3); font-size:13px; }
  .report-row:last-child { border-bottom:none; }
  .report-row .lbl { color:#94a3b8; }
  .report-row .val { color:#fff; font-weight:600; font-family:'Rajdhani',sans-serif; }
</style>
</head>

/* ===================== MODAL ===================== */
function showModal(title, fields, onSave){
  const box=document.getElementById('modalBox');
  box.innerHTML = `<h3>${title}</h3>` +
    fields.map(f=>`<div class="form-group"><label>${f.label}</label>${
      f.type==='select' ? `<select id="f_${f.name}">${f.options.map(o=>`<option value="${o}">${o}</option>`).join('')}</select>` :
      f.type==='textarea' ? `<textarea id="f_${f.name}" rows="3"></textarea>` :
      `<input id="f_${f.name}" type="${f.type||'text'}" value="${f.value||''}" placeholder="${f.placeholder||''}">`
    }</div>`).join('') +
    `<div class="modal-actions"><button class="btn btn-secondary" onclick="closeModal()">Cancel</button><button class="btn btn-primary" id="modalSave">Save</button></div>`;
  document.getElementById('modalOverlay').classList.add('show');
  document.getElementById('modalSave').onclick = () => {
    const data={};
    fields.forEach(f=>{ const el=document.getElementById('f_'+f.name); data[f.name]= el.value; });
    onSave(data);
    closeModal();
  };
}
function closeModal(){ document.getElementById('modalOverlay').classList.remove('show'); }

function table(headers, rows, opts={}){

}

      <div class="form-group"><label>Warehouse</label><select id="inv_wh">${S.warehouses.map(w=>`<option>${w.name}</option>`).join('')}</select></div>
    </div>
    <div style="margin:10px 0 6px;font-weight:600;color:#94a3b8;font-size:12px;">Items</div>
    <div id="inv_items_area"></div>
    <button class="btn btn-secondary btn-sm" onclick="addInvItem()" style="margin:6px 0 10px;">+ Add Item</button>
    <div class="form-row">
      <div class="form-group"><label>Payment Type</label><select id="inv_type"><option value="cash">Cash</option><option value="credit">Credit</option></select></div>
      <div class="form-group"><label>Paid Amount</label><input id="inv_paid" type="number" value="0"></div>
    </div>
    <div style="text-align:right;font-size:15px;font-weight:600;color:#fff;margin:8px 0;">Total: <span id="inv_total">Rs. 0</span></div>
    <div class="modal-actions">
      <button class="btn btn-secondary" onclick="closeModal();document.getElementById('modalBox').style.maxWidth=''">Cancel</button>
      <button class="btn btn-primary" onclick="saveInvoice()">Save Invoice</button>
    </div>
  `;
  document.getElementById('modalOverlay').classList.add('show');
  renderInvItems();
}
function addInvItem(){
  const p = S.products[0];
  window._invItems.push({product: p?p.name:'', qty:1, rate: p?(window._invType==='purchase'?p.purchase_price:p.sale_price):0, discount:0});
  renderInvItems();
}
function renderInvItems(){
  const area = document.getElementById('inv_items_area');
  if(!area) return;
  if(!window._invItems.length){ area.innerHTML='<div class="empty" style="padding:10px;">No items. Click + Add Item.</div>'; updateInvTotal(); return; }
  area.innerHTML = `<div class="table-wrap"><table><thead><tr><th>Product</th><th>Qty</th><th>Rate</th><th>Disc</th><th>Total</th><th></th></tr></thead><tbody>
    ${window._invItems.map((it,i)=>`<tr>
      <td><select onchange="window._invItems[${i}].product=this.value; syncRate(${i})" style="min-width:140px;">${S.products.map(p=>`<option ${p.name===it.product?'selected':''}>${p.name}</option>`).join('')}</select></td>
      <td><input type="number" value="${it.qty}" style="width:60px;" onchange="window._invItems[${i}].qty=+this.value; renderInvItems()"></td>
      <td><input type="number" value="${it.rate}" style="width:80px;" onchange="window._invItems[${i}].rate=+this.value; renderInvItems()"></td>
      <td><input type="number" value="${it.discount}" style="width:60px;" onchange="window._invItems[${i}].discount=+this.value; renderInvItems()"></td>
      <td>${money(it.qty*it.rate - (it.discount||0))}</td>
      <td><button class="btn btn-danger btn-sm" onclick="window._invItems.splice(${i},1); renderInvItems()">✕</button></td>
    </tr>`).join('')}
  </tbody></table></div>`;
  updateInvTotal();
}
function syncRate(i){
  const p = S.products.find(x=>x.name===window._invItems[i].product);
  if(p) window._invItems[i].rate = window._invType==='purchase' ? p.purchase_price : p.sale_price;
  renderInvItems();
}
function updateInvTotal(){
  const total = window._invItems.reduce((a,it)=>a + (it.qty*it.rate - (it.discount||0)),0);
  const el=document.getElementById('inv_total'); if(el) el.textContent = money(total);
}
function saveInvoice(){
  const isP = window._invType==='purchase';
  const total = window._invItems.reduce((a,it)=>a + (it.qty*it.rate - (it.discount||0)),0);
  const paid = +document.getElementById('inv_paid').value;
  const inv = {id:++S.nextId, no:document.getElementById('inv_no').value, party:document.getElementById('inv_party').value, date:document.getElementById('inv_date').value, total, paid, balance: total-paid, type: document.getElementById('inv_type').value};
  const wh = document.getElementById('inv_wh').value;
  if(isP){ S.purchaseInvoices.push(inv);
    window._invItems.forEach(it=>{
      const st = S.stock.find(s=>s.product===it.product && s.warehouse===wh);
      if(st) st.qty += it.qty; else S.stock.push({product:it.product,warehouse:wh,qty:it.qty});
    });
  } else {
    S.saleInvoices.push(inv);
    window._invItems.forEach(it=>{
      const st = S.stock.find(s=>s.product===it.product && s.warehouse===wh);
      if(st) st.qty -= it.qty;
    });
  }
  closeModal();

  <style>body{font-family:Arial,sans-serif;padding:30px;color:#111;}h1{color:#0a0f1e;}table{width:100%;border-collapse:collapse;margin-top:15px;}th,td{border:1px solid #ccc;padding:8px;text-align:left;}th{background:#f0f0f0;} .tot{font-weight:bold;} .hdr{display:flex;justify-content:space-between;margin-bottom:20px;}</style></head><body>

  <tr><td>1</td><td>Goods</td><td>-</td><td>-</td><td class="tot">${money(inv.total)}</td></tr>
  </tbody></table>

  </div>

let calcExpr='';
function calcPress(b){
  const d=document.getElementById('calcDisplay');
  if(b==='C'){ calcExpr=''; d.textContent='0'; return; }
  if(b==='⌫'){ calcExpr=calcExpr.slice(0,-1); d.textContent=calcExpr||'0'; return; }
  if(b==='='){ try{ calcExpr=String(eval(calcExpr)); }catch{ calcExpr='Error'; } d.textContent=calcExpr; return; }
  calcExpr+=b; d.textContent=calcExpr;
}

pages['word-paid'] = () => card(`
  ${sectionTitle('Word Paid (Number to Words)')}
  <div class="form-group"><label>Amount</label><input type="number" id="wp_amt" value="12345" oninput="numToWords()"></div>
  <div class="card" style="background:rgba(6,11,24,.4);"><div id="wp_out" style="color:var(--accent-light);font-family:'Rajdhani',sans-serif;font-size:18px;font-weight:600;">Twelve Thousand Three Hundred Forty Five</div></div>

function numToWords(){
  const n=+document.getElementById('wp_amt').value;
  const ones=['','One','Two','Three','Four','Five','Six','Seven','Eight','Nine','Ten','Eleven','Twelve','Thirteen','Fourteen','Fifteen','Sixteen','Seventeen','Eighteen','Nineteen'];
  const tens=['','','Twenty','Thirty','Forty','Fifty','Sixty','Seventy','Eighty','Ninety'];
  function conv(x){ if(x<20) return ones[x]; if(x<100) return tens[Math.floor(x/10)]+(x%10?' '+ones[x%10]:''); if(x<1000) return ones[Math.floor(x/100)]+' Hundred'+(x%100?' '+conv(x%100):''); if(x<100000) return conv(Math.floor(x/1000))+' Thousand'+(x%1000?' '+conv(x%1000):''); if(x<10000000) return conv(Math.floor(x/100000))+' Lakh'+(x%100000?' '+conv(x%100000):''); return conv(Math.floor(x/10000000))+' Crore'+(x%10000000?' '+conv(x%10000000):''); }
  document.getElementById('wp_out').textContent = conv(n||0) + ' Rupees Only';
}

function buildThemeSwitcher(){
  const themes = [
    {name:'navy',color:'#38bdf8'},{name:'midnight',color:'#a855f7'},{name:'emerald',color:'#10b981'},
    {name:'ruby',color:'#ef4444'},{name:'amber',color:'#f59e0b'},{name:'obsidian',color:'#22d3ee'},
    {name:'ocean',color:'#14b8a6'},{name:'lavender',color:'#c084fc'},{name:'forest',color:'#84cc16'},
    {name:'rosegold',color:'#fb7185'},{name:'midnight2',color:'#818cf8'},{name:'slate',color:'#94a3b8'},
  ];
  const el=document.getElementById('themeSwitcher');
  if(!el) return;
  el.innerHTML = themes.map(t=>`<div class="theme-dot ${S.theme===t.name?'active':''}" style="background:${t.color}" onclick="setTheme('${t.name}')" title="${t.name}"></div>`).join('');
}
function setTheme(name){
  S.theme=name;
  const colors = {
    navy:{accent:'#38bdf8',navy:'#060b18'}, midnight:{accent:'#a855f7',navy:'#0a0a1a'},
    emerald:{accent:'#10b981',navy:'#0a1a0a'}, ruby:{accent:'#ef4444',navy:'#1a0a0a'},
    amber:{accent:'#f59e0b',navy:'#1a140a'}, obsidian:{accent:'#22d3ee',navy:'#000000'},
    ocean:{accent:'#14b8a6',navy:'#0a0d1a'}, lavender:{accent:'#c084fc',navy:'#0e0a1a'},
    forest:{accent:'#84cc16',navy:'#0a1a0e'}, rosegold:{accent:'#fb7185',navy:'#1a0a14'},
    midnight2:{accent:'#818cf8',navy:'#0a0a1a'}, slate:{accent:'#94a3b8',navy:'#0f172a'},
  };
  const c=colors[name]||colors.navy;
  document.documentElement.style.setProperty('--accent',c.accent);
  document.body.style.background=c.navy;
  document.getElementById('mouseOrb').style.background=`radial-gradient(circle,${c.accent}22 0%,transparent 70%)`;
  buildThemeSwitcher();
  saveState();
  toast('Theme: '+name);
}
